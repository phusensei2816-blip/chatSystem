services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: chat, POSTGRES_USER: chat, POSTGRES_PASSWORD: chat}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  web:
    build: .
    command: >
      sh -c "python manage.py makemigrations chat &&
             python manage.py migrate &&
             python manage.py seed_demo &&
             daphne -b 0.0.0.0 -p 8000 chatsystem.asgi:application"
    environment: &env
      PG_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    volumes: [".:/app"]            # migrations sinh ra được lưu lại ở máy bạn
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      # chỉ OK khi daphne đã lắng nghe (tức là migrate xong)
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 3s
      retries: 40

  sweeper:
    build: .
    command: python manage.py run_presence_sweeper
    environment: *env
    volumes: [".:/app"]
    depends_on:
      web: {condition: service_healthy}

volumes:
  pgdata: